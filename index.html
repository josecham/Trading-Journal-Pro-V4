<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trading Journal V6</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0e11">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgMain: '#0b0e11',
                        bgCard: '#181a20',
                        bgInput: '#2b2f36',
                        cryptoGreen: '#0ecb81',
                        cryptoRed: '#f6465d',
                        gold: '#f0b90b'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b0e11; user-select: none; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; height: 100vh; overflow: hidden; }
        ::-webkit-scrollbar { display: none; }

        .confetti-container {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 9999; overflow: hidden;
        }
        .confetti-piece {
            position: absolute;
            top: -10px;
            width: 10px; height: 10px;
            opacity: 0.8;
            border-radius: 2px;
            animation: fall linear forwards;
        }
        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }

        .animate-fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="text-gray-200 font-sans antialiased">
    <div id="root"></div>

    <!-- Scripts de React Core en versiones estables de producción -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK Compat para inyección CDN clásica -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyAts93tv8WY702grlHPGnh6ID1QeR_3XQc",
            authDomain: "tradingjournalpro-3507c.firebaseapp.com",
            projectId: "tradingjournalpro-3507c",
            storageBucket: "tradingjournalpro-3507c.firebasestorage.app",
            messagingSenderId: "318505631445",
            appId: "1:318505631445:web:f3046b77497dd1b460ec5c",
            measurementId: "G-48ZJ22DD37"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        const TEXTO_EMOJIS = {
            'CALMO': '😎',
            'ANSIOSO': '😰',
            'ENOJADO': '😡',
            'MIEDO': '😨'
        };

        const ejecutarVibracion = (patron) => {
            if (navigator.vibrate) navigator.vibrate(patron);
        };

        const dispararConfeti = () => {
            const container = document.createElement('div');
            container.className = 'confetti-container';
            document.body.appendChild(container);
            const colores = ['#0ecb81', '#f0b90b', '#3b82f6', '#ff007f', '#a855f7'];
            for (let i = 0; i < 70; i++) {
                const pieza = document.createElement('div');
                pieza.className = 'confetti-piece';
                pieza.style.left = Math.random() * 100 + 'vw';
                pieza.style.backgroundColor = colores[Math.floor(Math.random() * colores.length)];
                pieza.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                pieza.style.animationDelay = (Math.random() * 0.4) + 's';
                container.appendChild(pieza);
            }
            setTimeout(() => { container.remove(); }, 4000);
        };

        function App() {
            const hoy = new Date();
            
            const [user, setUser] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegistering, setIsRegistering] = useState(false);
            const [authError, setAuthError] = useState('');

            const [mesVista, setMesVista] = useState(hoy.getMonth());
            const [añoVista, setAñoVista] = useState(hoy.getFullYear());
            const [vista, setVista] = useState('calendario'); 
            const [trades, setTrades] = useState([]);
            const [mostrarTerminos, setMostrarTerminos] = useState(false);

            const [activo, setActivo] = useState('');
            const [resultado, setResultado] = useState('');
            const [estado, setEstado] = useState('WIN');
            const [emocion, setEmocion] = useState('CALMO');
            const [diaSeleccionado, setDiaSeleccionado] = useState(hoy.getDate());
            
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            // Helper interno súper seguro para números
            const safeFixed = (val) => {
                const n = parseFloat(val);
                return isNaN(n) ? "0.00" : n.toFixed(2);
            };

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((currentUser) => {
                    setUser(currentUser);
                    if (!currentUser) setTrades([]);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;

                const unsubscribe = db.collection('trades')
                    .where('userId', '==', user.uid)
                    .orderBy('id', 'desc')
                    .onSnapshot((snapshot) => {
                        const listaTrades = snapshot.docs.map(doc => ({
                            docId: doc.id,
                            ...doc.data()
                        }));
                        setTrades(listaTrades);
                    }, (error) => {
                        console.error("Error Firebase:", error);
                    });

                return () => unsubscribe();
            }, [user]);

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError('');
                try {
                    if (isRegistering) {
                        await auth.createUserWithEmailAndPassword(email, password);
                    } else {
                        await auth.signInWithEmailAndPassword(email, password);
                    }
                    ejecutarVibracion(40);
                } catch (error) {
                    setAuthError(error.message);
                    ejecutarVibracion([60, 50, 60]);
                }
            };

            const handleLogout = () => { 
                ejecutarVibracion(30);
                auth.signOut(); 
            };

            const agregarTrade = async (e) => {
                e.preventDefault();
                if (!activo || !resultado || !user) return;

                const monto = Math.abs(parseFloat(resultado));
                if (isNaN(monto)) return;

                const nuevoTrade = {
                    id: Date.now(),
                    userId: user.uid,
                    activo: activo.toUpperCase(),
                    resultado: estado === 'WIN' ? monto : -monto,
                    estado,
                    emocion, 
                    dia: parseInt(diaSeleccionado),
                    mes: mesVista,
                    año: añoVista
                };

                try {
                    await db.collection('trades').add(nuevoTrade);
                    if (estado === 'WIN') { 
                        dispararConfeti(); 
                        ejecutarVibracion([50, 60, 50]);
                    } else {
                        ejecutarVibracion(90);
                    }
                    setActivo('');
                    setResultado('');
                    setEmocion('CALMO');
                } catch (error) {
                    console.error("Error al guardar:", error);
                }
            };

            const eliminarTrade = async (docId) => {
                try {
                    await db.collection('trades').doc(docId).delete();
                    ejecutarVibracion(60);
                } catch (error) {
                    console.error("Error al eliminar:", error);
                }
            };

            const nombreMeses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            const diasSemana = ["DOM", "LUN", "MAR", "MIÉ", "JUE", "VIE", "SÁB"];
            const primerDiaIndex = new Date(añoVista, mesVista, 1).getDay();
            const totalDiasMes = new Date(añoVista, mesVista + 1, 0).getDate();
            
            const tradesDelMesActual = trades.filter(t => t.mes === mesVista && t.año === añoVista);
            
            const obtenerDataDia = (nroDia) => {
                const tradesDelDia = tradesDelMesActual.filter(t => t.dia === nroDia);
                if (tradesDelDia.length === 0) return null;
                return { pnl: tradesDelDia.reduce((acc, t) => acc + t.resultado, 0), count: tradesDelDia.length };
            };

            const totalPnlMes = tradesDelMesActual.reduce((acc, t) => acc + t.resultado, 0);
            const totalPnlAcumulado = trades.reduce((acc, t) => acc + t.resultado, 0);

            const obtenerEmocionDominante = () => {
                if (tradesDelMesActual.length === 0) return { key: 'VACIO', texto: 'Sin datos' };
                const conteo = {};
                tradesDelMesActual.forEach(t => {
                    const emo = t.emocion || 'CALMO';
                    conteo[emo] = (conteo[emo] || 0) + 1;
                });
                let maxEmo = 'CALMO';
                let maxConteo = 0;
                for (const key in conteo) {
                    if (conteo[key] > maxConteo) {
                        maxConteo = conteo[key];
                        maxEmo = key;
                    }
                }
                const mapaTextos = {
                    'CALMO': 'Calmo / Focalizado',
                    'ANSIOSO': 'Ansioso / Apurado',
                    'ENOJADO': 'Enojado (Furia)',
                    'MIEDO': 'Miedo al mercado'
                };
                return { key: maxEmo, texto: mapaTextos[maxEmo] || 'Desconocido' };
            };

            const emocionDominante = obtenerEmocionDominante();

            useEffect(() => {
                if (vista === 'metricas' && chartRef.current && trades.length > 0) {
                    if (chartInstance.current) chartInstance.current.destroy();
                    const tradesCronologicos = [...trades].sort((a, b) => a.id - b.id);
                    let balanceAcumulado = 0;
                    const dataPuntos = [0];
                    const etiquetas = ["Inicio"];
                    tradesCronologicos.forEach(t => {
                        balanceAcumulado += t.resultado;
                        dataPuntos.push(balanceAcumulado);
                        etiquetas.push(`${t.dia}/${t.mes + 1}`);
                    });
                    const ctx = chartRef.current.getContext('2d');
                    chartInstance.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: etiquetas,
                            datasets: [{
                                data: dataPuntos,
                                borderColor: balanceAcumulado >= 0 ? '#0ecb81' : '#f6465d',
                                backgroundColor: 'rgba(0,0,0,0)',
                                borderWidth: 2,
                                pointBackgroundColor: '#f0b90b',
                                pointRadius: 2,
                                tension: 0.1
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                    });
                }
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [vista, trades]);

            if (!user) {
                return (
                    <div className="h-screen max-w-md mx-auto bg-bgMain flex flex-col justify-center p-6">
                        <div className="bg-bgCard p-6 rounded-2xl border border-gray-800 shadow-2xl flex flex-col gap-4">
                            <div className="text-center mb-2">
                                <h2 className="text-xl font-black text-white uppercase tracking-wider">Trading Journal</h2>
                                <p className="text-xs text-gray-400 mt-1">Sincronización en la Nube</p>
                            </div>
                            <form onSubmit={handleAuth} className="flex flex-col gap-3">
                                <input 
                                    type="email" placeholder="Correo electrónico" value={email} onChange={(e) => setEmail(e.target.value)} required
                                    className="bg-bgInput text-white px-4 py-3 rounded-xl text-xs font-bold outline-none border border-transparent focus:border-gold"
                                />
                                <input 
                                    type="password" placeholder="Contraseña" value={password} onChange={(e) => setPassword(e.target.value)} required
                                    className="bg-bgInput text-white px-4 py-3 rounded-xl text-xs font-bold outline-none border border-transparent focus:border-gold"
                                />
                                {authError && <p className="text-[10px] text-cryptoRed font-bold text-center">{authError}</p>}
                                <button type="submit" className="w-full bg-gold text-black font-black py-3 rounded-xl text-xs uppercase tracking-widest mt-1">
                                    {isRegistering ? 'Crear Cuenta Cloud' : 'Ingresar'}
                                </button>
                            </form>
                            <button type="button" onClick={() => { ejecutarVibracion(20); setIsRegistering(!isRegistering); }} className="text-[11px] text-gray-500 font-bold hover:text-white underline text-center">
                                {isRegistering ? '¿Ya tenés cuenta? Iniciá sesión' : '¿No tenés cuenta? Registrate gratis'}
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen max-w-md mx-auto bg-bgMain flex flex-col overflow-hidden relative">
                    <header className="bg-bgMain px-4 py-4 border-b border-gray-800 flex justify-between items-center z-50 shrink-0">
                        <div className="flex items-center gap-2">
                            <div className="w-2.5 h-2.5 bg-cryptoGreen rounded-full"></div>
                            <h1 className="text-base font-black tracking-wider uppercase">Trading Journal</h1>
                        </div>
                        <div className="flex items-center gap-2">
                            <a href="https://www.facebook.com/share/g/1BBVwh32q1/" target="_blank" rel="noopener noreferrer" onClick={() => ejecutarVibracion(20)} className="text-[9px] text-white font-black bg-blue-600/20 border border-blue-500/30 px-2 py-1 rounded-lg hover:bg-blue-600/40 transition">
                                COMUNIDAD 👥
                            </a>
                            <button onClick={handleLogout} className="text-[9px] text-cryptoRed font-bold bg-cryptoRed/10 border border-cryptoRed/20 px-2 py-1 rounded-lg">
                                CERRAR SESIÓN
                            </button>
                        </div>
                    </header>

                    <main className="p-4 flex flex-col gap-5 flex-1 overflow-y-auto pb-28">
                        <div className="bg-bgCard rounded-2xl border border-gray-800 p-4 shadow-xl shrink-0">
                            <div className="flex justify-between items-center mb-4">
                                <div className="flex items-center gap-2">
                                    <button type="button" onClick={() => { ejecutarVibracion(15); setMesVista(mesVista === 0 ? 11 : mesVista - 1); }} className="w-8 h-8 rounded-lg bg-bgInput flex items-center justify-center font-bold text-gray-400">&lt;</button>
                                    <h2 className="text-sm font-black text-white uppercase tracking-wide min-w-[110px] text-center">
                                        {nombreMeses[mesVista]} <span className="text-gray-500 font-mono text-xs">{añoVista}</span>
                                    </h2>
                                    <button type="button" onClick={() => { ejecutarVibracion(15); setMesVista(mesVista === 11 ? 0 : mesVista + 1); }} className="w-8 h-8 rounded-lg bg-bgInput flex items-center justify-center font-bold text-gray-400">&gt;</button>
                                </div>
                                <span className={`text-xs font-bold font-mono px-2 py-1 rounded ${totalPnlMes >= 0 ? 'text-cryptoGreen bg-cryptoGreen/10' : 'text-cryptoRed bg-cryptoRed/10'}`}>
                                    ${safeFixed(totalPnlMes)}
                                </span>
                            </div>

                            {vista === 'calendario' ? (
                                <div>
                                    <div className="grid grid-cols-7 gap-1 text-center mb-1">
                                        {diasSemana.map(d => <span key={d} className="text-[9px] text-gray-500 font-bold">{d}</span>)}
                                    </div>
                                    <div className="grid grid-cols-7 gap-1.5">
                                        {Array(primerDiaIndex).fill(null).map((_, i) => <div key={i}></div>)}
                                        {Array(totalDiasMes).fill(null).map((_, index) => {
                                            const nroDia = index + 1;
                                            const dataDia = obtenerDataDia(nroDia);
                                            return (
                                                <div key={nroDia} onClick={() => { ejecutarVibracion(25); setDiaSeleccionado(nroDia); }} className={`aspect-square rounded-lg flex flex-col justify-between p-1 text-[10px] cursor-pointer ${dataDia ? (dataDia.pnl >= 0 ? 'bg-cryptoGreen text-black font-bold' : 'bg-cryptoRed text-white font-bold') : 'bg-bgInput/40 text-gray-400'} ${diaSeleccionado === nroDia ? 'ring-2 ring-gold' : ''}`}>
                                                    <span>{nroDia}</span>
                                                    {dataDia && <span className="text-[7px] truncate">{dataDia.pnl >= 0 ? '+' : ''}{parseFloat(dataDia.pnl).toFixed(1)}</span>}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            ) : (
                                <div className="w-full relative h-[180px]"><canvas ref={chartRef}></canvas></div>
                            )}
                        </div>

                        {vista === 'metricas' && (
                            <div className="flex flex-col gap-2 shrink-0">
                                <div className="grid grid-cols-2 gap-2">
                                    <div className="bg-bgCard p-3 rounded-xl border border-gray-800">
                                        <span className="text-[9px] text-gray-500 font-bold block">PnL MES</span>
                                        <span className="text-sm font-black text-white">${safeFixed(totalPnlMes)}</span>
                                    </div>
                                    <div className="bg-bgCard p-3 rounded-xl border border-gold/20">
                                        <span className="text-[9px] text-gold font-bold block">ACUMULADO</span>
                                        <span className="text-sm font-black text-white">${safeFixed(totalPnlAcumulado)}</span>
                                    </div>
                                </div>
                                <div className="bg-bgCard p-3 rounded-xl border border-gray-800 flex items-center justify-between">
                                    <div>
                                        <span className="text-[9px] text-gray-400 font-bold block uppercase tracking-wider">Métrica Psicotrading</span>
                                        <span className="text-xs font-black text-white block mt-0.5">Emoción Dominante</span>
                                        <span className="text-[10px] text-gray-500 font-medium">{emocionDominante.texto}</span>
                                    </div>
                                    <div className="w-12 h-12 rounded-xl flex items-center justify-center text-2xl bg-bgInput">
                                        {emocionDominante.key !== 'VACIO' ? TEXTO_EMOJIS[emocionDominante.key] : '❔'}
                                    </div>
                                </div>
                            </div>
                        )}

                        {vista === 'calendario' && (
                            <form onSubmit={agregarTrade} className="bg-bgCard p-4 rounded-2xl border border-gray-800 flex flex-col gap-3 shrink-0">
                                <div className="grid grid-cols-2 gap-2">
                                    <input type="text" placeholder="Activo (BTC)" value={activo} onChange={(e) => setActivo(e.target.value)} className="bg-bgInput text-white px-3 py-2.5 rounded-xl text-xs font-bold outline-none"/>
                                    <input type="number" step="any" placeholder="Resultado USD" value={resultado} onChange={(e) => setResultado(e.target.value)} className="bg-bgInput text-white px-3 py-2.5 rounded-xl text-xs font-bold outline-none"/>
                                </div>
                                <div className="flex flex-col gap-1.5">
                                    <span className="text-[10px] text-gray-500 font-bold uppercase px-1">Psicotrading (Estado Emocional)</span>
                                    <div className="grid grid-cols-4 gap-1.5">
                                        {[
                                            { id: 'CALMO', label: 'Calmo' },
                                            { id: 'ANSIOSO', label: 'Ansioso' },
                                            { id: 'ENOJADO', label: 'Enojado' },
                                            { id: 'MIEDO', label: 'Miedo' }
                                        ].map(item => (
                                            <button key={item.id} type="button" onClick={() => { ejecutarVibracion(15); setEmocion(item.id); }} className={`py-2 rounded-xl flex flex-col items-center justify-center border transition ${emocion === item.id ? 'bg-bgInput border-gold text-white' : 'bg-bgInput/40 border-transparent text-gray-400'}`}>
                                                <span className="text-2xl mb-1">{TEXTO_EMOJIS[item.id]}</span>
                                                <span className="text-[8px] font-bold uppercase tracking-wide">{item.label}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <button type="button" onClick={() => { ejecutarVibracion(20); setEstado('WIN'); }} className={`py-2 rounded-xl text-xs font-bold transition ${estado === 'WIN' ? 'bg-cryptoGreen text-black' : 'bg-bgInput text-gray-400'}`}>WIN</button>
                                    <button type="button" onClick={() => { ejecutarVibracion(20); setEstado('LOSS'); }} className={`py-2 rounded-xl text-xs font-bold transition ${estado === 'LOSS' ? 'bg-cryptoRed text-white' : 'bg-bgInput text-gray-400'}`}>LOSS</button>
                                </div>
                                <button type="submit" className="bg-gold text-black font-black py-3 rounded-xl text-xs uppercase tracking-wider">Guardar en la Nube</button>
                            </form>
                        )}

                        <div className="shrink-0">
                            <h3 className="text-xs font-black text-gray-500 uppercase tracking-wider mb-2 px-1">Operaciones del Mes</h3>
                            <div className="flex flex-col gap-2">
                                {tradesDelMesActual.map(t => (
                                    <div key={t.id} className="bg-bgCard px-4 py-3 rounded-xl border border-gray-800 flex justify-between items-center">
                                        <div className="flex items-center gap-2">
                                            <span className="bg-bgInput/60 p-1 rounded-lg flex items-center justify-center w-8 h-8 text-lg">
                                                {TEXTO_EMOJIS[t.emocion || 'CALMO'] || TEXTO_EMOJIS['CALMO']}
                                            </span>
                                            <span className="text-xs font-black text-white">{t.activo} (Día {t.dia})</span>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <span className={`font-bold text-xs ${t.resultado >= 0 ? 'text-cryptoGreen' : 'text-cryptoRed'}`}>${safeFixed(t.resultado)}</span>
                                            <button type="button" onClick={() => eliminarTrade(t.docId)} className="text-gray-500 hover:text-cryptoRed font-bold text-lg px-1">&times;</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>

                    <nav className="absolute bottom-0 left-0 right-0 max-w-md mx-auto bg-bgCard border-t border-gray-800 px-6 py-4 flex justify-between items-center z-50 shadow-[0_-8px_30px_rgba(0,0,0,0.7)]">
                        <button type="button" onClick={() => { ejecutarVibracion(20); setVista('calendario'); }} className={`flex-1 flex flex-col items-center gap-1 py-1 transition ${vista === 'calendario' ? 'text-gold scale-105' : 'text-gray-300 hover:text-white'}`}>
                            <span className="text-[18px]">📅</span>
                            <span className="text-[11px] font-black uppercase tracking-wider">Calendario</span>
                        </button>
                        <button type="button" onClick={() => { ejecutarVibracion(20); setVista('metricas'); }} className={`flex-1 flex flex-col items-center gap-1 py-1 transition ${vista === 'metricas' ? 'text-gold scale-105' : 'text-gray-300 hover:text-white'}`}>
                            <span className="text-[18px]">📊</span>
                            <span className="text-[11px] font-black uppercase tracking-wider">Métricas</span>
                        </button>
                        <button type="button" onClick={() => { ejecutarVibracion(20); setMostrarTerminos(true); }} className="flex-1 flex flex-col items-center gap-1 py-1 text-gray-300 hover:text-white transition">
                            <span className="text-[18px]">📜</span>
                            <span className="text-[11px] font-black uppercase tracking-wider text-center leading-tight">Legal</span>
                        </button>
                    </nav>

                    {mostrarTerminos && (

                                    </div>
