        const dispararConfeti = () => {
            const container = document.createElement('div');
            container.className = 'confetti-container';
            document.body.appendChild(container);
            const colores = ['#0ecb81', '#f0b90b', '#3b82f6', '#ff007f', '#a855f7'];
            for (let i = 0; i < 70; i++) {
                const pieza = document.createElement('div');
                pieza.className = 'confetti-piece';
                pieza.style.left = Math.random() * 100 + 'vw';
                pieza.style.backgroundColor = colores[Math.floor(Math.random() * colores.length)];
                pieza.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                pieza.style.animationDelay = (Math.random() * 0.4) + 's';
                container.appendChild(pieza);
            }
            setTimeout(() => { container.remove(); }, 4000);
        };

                return isNaN(n) ? "0.00" : n.toFixed(2);

                    setUser(currentUser);

                return db.collection('trades')

                        await auth.signInWithEmailAndPassword(email, password);

                    ejecutarVibracion(40);

                    setAuthError(error.message);
                    ejecutarVibracion([60, 50, 60]);
                }
            };

                    id: Date.now(),
                    userId: user.uid,
                    activo: activo.toUpperCase(),
                    resultado: estado === 'WIN' ? monto : -monto,

                };

                    else { ejecutarVibracion(90); }
                    setActivo(''); setResultado(''); setEmocion('CALMO');
                } catch (e) { console.error(e); }
            };
